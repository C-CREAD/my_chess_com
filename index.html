<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Tiers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><text y='.9em' font-size='9'>♞</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebef;--ink:#14202b;--mute:#5b6875;--card:#fff;--line:#cfd7de;
--t0:#6b7a8a;--t1:#238580;--t2:#c98312;--t3:#b3362f;--w:#2f7d4f;--l:#b3362f;--d:#9aa5b0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
header{padding:48px 20px 28px;background:
 conic-gradient(#d9e0e6 25%,transparent 0 50%,#d9e0e6 0 75%,transparent 0) 0 0/48px 48px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:800 clamp(2rem,6vw,3.4rem)/1 "Bricolage Grotesque",sans-serif;margin:0 0 8px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute);max-width:60ch}
main{padding:24px 20px 56px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.who{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.who img,.ph{width:56px;height:56px;border-radius:8px;background:var(--line);object-fit:cover}
.who a{font:800 1.3rem "Bricolage Grotesque",sans-serif;color:inherit;text-decoration:none}
.who a:hover,.who a:focus-visible{text-decoration:underline}
.sub{color:var(--mute);font-size:.88rem}
.pill{margin-left:auto;padding:3px 10px;border-radius:99px;color:#fff;font-size:.82rem;font-weight:500;white-space:nowrap}
.mode{padding:14px 0;border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.row b{font:800 1.9rem "Bricolage Grotesque",sans-serif}
.row .tier{font-weight:500;font-size:.9rem}
.ruler{position:relative;display:flex;height:8px;border-radius:4px;margin:10px 0 6px}
.ruler i{display:block;height:100%;opacity:.35}
.ruler i:first-child{border-radius:4px 0 0 4px}.ruler i:nth-last-child(2){border-radius:0 4px 4px 0}
.pin{position:absolute;top:-3px;width:4px;height:14px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:8px 0 6px}
.bar i{display:block;height:100%}
.tot b{font-size:1.4rem}
.err,footer{color:var(--mute);font-size:.85rem}
footer{padding:0 20px 40px}
</style></head><body>
<header><div class="wrap"><h1>Chess Tiers</h1>
<p>Current Chess.com ratings, sorted into skill tiers, with all-time results.</p></div></header>
<main><div class="wrap"><div id="grid" class="grid"></div><p id="msg" class="err"></p></div></main>
<footer><div class="wrap">
<span id="upd"></span> Tiers: under 1200 Beginner / Casual, 1200–1799 Intermediate, 1800–2199 Advanced, 2200+ Expert.
Data from the Chess.com Published-Data API, refreshed every 12 hours.</div></footer>

<script>
const TIERS=[["Beginner / Casual",0,"--t0"],["Intermediate Player",1200,"--t1"],["Advanced Player",1800,"--t2"],["Expert Player",2200,"--t3"]];
const MAX=2800, col=n=>`var(${TIERS.find(t=>t[0]===n)[2]})`;
const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const wld=r=>`${r.win.toLocaleString()}W · ${r.loss.toLocaleString()}L · ${r.draw.toLocaleString()}D`;
function bar(r){const t=r.win+r.loss+r.draw,b=h("div","bar");
 [["win","--w"],["loss","--l"],["draw","--d"]].forEach(([k,c])=>{const i=h("i");i.style.width=pct(r[k],t)+"%";i.style.background=`var(${c})`;b.append(i)});return b}
function ruler(v){const r=h("div","ruler");
 TIERS.forEach((t,i)=>{const s=h("i"),end=TIERS[i+1]?TIERS[i+1][1]:MAX;
  s.style.width=(end-t[1])/MAX*100+"%";s.style.background=`var(${t[2]})`;r.append(s)});
 const p=h("span","pin");p.style.left=Math.min(v,MAX)/MAX*100+"%";r.append(p);return r}
function card(p){
 const c=h("article","card"),who=h("div","who");
 if(p.avatar){const im=h("img");im.src=p.avatar;im.alt="";im.loading="lazy";who.append(im)}else who.append(h("div","ph"));
 const nm=h("div"),a=h("a",null,p.username);if(p.url){a.href=p.url;a.rel="noopener"}
 nm.append(a,h("div","sub",p.name||""));
 const pill=h("span","pill",p.tier);pill.style.background=col(p.tier);who.append(nm,pill);c.append(who);
 Object.entries(p.modes).forEach(([m,d])=>{
  const s=h("section","mode"),r=h("div","row"),t=h("span","tier",d.tier);t.style.color=col(d.tier);
  r.append(h("span","sub",m[0].toUpperCase()+m.slice(1)),h("b",null,d.rating),t,h("span","sub",d.best?`peak ${d.best}`:""));
  s.append(r,ruler(d.rating),h("div","sub",wld(d)),bar(d));c.append(s)});
 const t=p.total,n=t.win+t.loss+t.draw,s=h("section","mode tot"),r=h("div","row");
 r.append(h("span","sub","All-time, rapid + blitz + bullet"),h("b",null,pct(t.win,n)+"% wins"));
 s.append(r,h("div","sub",`${n.toLocaleString()} games · ${wld(t)}`),bar(t));c.append(s);return c}
fetch("data/stats.json").then(r=>r.json()).then(d=>{
 const g=document.getElementById("grid");d.players.forEach(p=>g.append(card(p)));
 document.getElementById("upd").textContent="Updated "+new Date(d.updated).toLocaleString()+". ";
}).catch(()=>{document.getElementById("msg").textContent="Couldn't load data/stats.json. Run scripts/fetch_stats.py first, or wait for the next deploy."});
</script>
</body>
</html>
